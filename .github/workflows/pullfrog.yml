# PULLFROG — self-contained.
#
# This repo is public and the shared workflows live in the private
# gainsway/github-workflows, which a public repo cannot call. The job is
# therefore inlined here rather than dispatched to a reusable workflow.
# Keep in sync with gainsway/github-workflows/.github/workflows/job.pullfrog.yml
#
# Requires at least one provider secret below to be set at the repo or org
# level (e.g. PULLFROG_ANTHROPIC_API_KEY or PULLFROG_CLAUDE_CODE_OAUTH_TOKEN).
#
# Usage: Actions tab -> Pullfrog -> Run workflow -> fill in prompt, or
# `gh workflow run pullfrog.yml -f prompt="..."`.
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
        required: true
      name:
        type: string
        description: Run name

jobs:
  pullfrog:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@a809795406487e13f894c681ea09b4f96015284d # v0.1.36
        with:
          prompt: ${{ inputs.prompt }}
          # push defaults to "enabled" in the action itself; this job only
          # grants id-token/contents:read for auth and review use, so keep
          # it read-only here rather than relying on job permissions alone.
          push: disabled
          shell: restricted
        env:
          # Provider API keys — set at least one as a repo/org secret.
          # Unset ones simply resolve to empty and are ignored by the action.
          ANTHROPIC_API_KEY: ${{ secrets.PULLFROG_ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.PULLFROG_CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.PULLFROG_OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.PULLFROG_GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.PULLFROG_GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.PULLFROG_XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.PULLFROG_DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.PULLFROG_MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.PULLFROG_OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.PULLFROG_OPENCODE_API_KEY }}

          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>

          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>

          # for any OpenAI-compatible endpoint — LiteLLM, Cloudflare AI Gateway,
          # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.PULLFROG_OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.PULLFROG_OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ secrets.PULLFROG_OPENAI_COMPATIBLE_MODEL_ID }}
          # both limits are required — set them to the real limits of that model
          OPENAI_COMPATIBLE_CONTEXT: ${{ secrets.PULLFROG_OPENAI_COMPATIBLE_CONTEXT }}
          OPENAI_COMPATIBLE_MAX_OUTPUT: ${{ secrets.PULLFROG_OPENAI_COMPATIBLE_MAX_OUTPUT }}
